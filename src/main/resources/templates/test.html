<!--SQL Queries: Workbench vs Repository-->

<!--1. MySQL Workbench (SQL)-->
<!--Uses SQL.-->
<!--Talks directly to the MySQL database.-->
<!--Uses table names and column names.-->

<!--Example 1:-->

<!--SELECT * FROM farmer;-->

<!--Example 2:-->

<!--SELECT name-->
<!--FROM farmer-->
<!--WHERE status = 'ACTIVE';-->





<!--2. Spring Boot Repository-->
<!--a) Derived Query-->
<!--No SQL is written.-->
<!--Spring generates the query automatically.-->

<!--Example:-->

<!--List<Farmer> findByStatus(Status status);-->
<!--    b) JPQL (@Query)-->
<!--    Uses Entity names and Java field names.-->
<!--    Hibernate converts it into SQL.-->

<!--    Example 1:-->

<!--    @Query("SELECT f FROM Farmer f")-->

<!--        Example 2:-->

<!--            c) Native Query-->

<!--                SQL (Workbench)	JPQL (Repository)-->
<!--                Uses table names	Uses entity names-->
<!--                Uses column names	Uses Java field names-->

<!--                Easy to Remember-->
<!--                SQL → Table & Column-->
