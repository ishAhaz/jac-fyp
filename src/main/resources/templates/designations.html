<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designation Management</title>
    <link rel="icon" href="/images/img/Logo.png">
    <link rel="stylesheet" href="/css/bootstrap-5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/fontawesome-free-7.0.1/css/all.min.css">
    <link rel="stylesheet" href="/css/css-module/dashboard.css">
    <link rel="stylesheet" href="/css/css-module/D5-01.css">

    <link rel="stylesheet" href="/js/notiflix/dist/notiflix-3.2.8.min.css">
    <!-- for search -->
    <link rel="stylesheet" href="/js/DataTabels/datatables.min.css">

</head>
<body>
<div id="topbar"></div>
<div class="layout">
    <div id="sidebar"></div>

    <div class="main-content" id="mainContent">
<div class="container-fluid">
    <!-- navigator -->
    <div class="row div-navigator m-2 p-2">
        <div class="col-12">
            <p><a href="/dashboard">Dashboard</a> /Employee Module /Designation Management</p>
        </div>
    </div>

    <!-- title area -->
    <div class="row p-2 m-2 div-title">
        <div class="col text-center shadow p-1 mb-2 bg-body-tertiary rounded">
            <h1 id="idTitle">Designation Management</h1>
        </div>
    </div>

    <!-- add new model button -->
    <div class="row mt-2">
        <div class="col text-end">
            <button id="addNewDesignationId" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#DesignationAddForm">Add New Designation</button>
        </div>
    </div>

    <!-- table area -->
    <div class="row mt-2">
        <div class="col">
            <div class="card card-body tableCard">
                <div class="table-responsive">
                    <table class="table table-hover table-bordered table-striped" id="tableDesignation">
                        <thead class="table-dark" id="tableHeadId">
                        <tr>
                            <th>#</th>
                            <th>Designation ID</th>
                            <th>Designation Name</th>
                            <th>Modify</th>
                        </tr>
                        </thead>
                        <tbody id="tableBodyId">

                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</div>
    </div>
</div>
<!-- designation add form modal -->
<div class="modal" id="DesignationAddForm" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="formTitleEdit">Edit Designation</h2>
                <h2 id="formTitleNew">Add New Designation</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="close"></button>
            </div>
            <div class="modal-body">
                <form id="formDesignation" onsubmit="return false" novalidate>
                    <div class="row mt-1">
                        <div class="col-4">
                            <label ><b>Created Date & Time :</b></label>
                            <p id="createDate"></p>
                        </div>
                        <div class="col-4">
                            <label><b>Last Updated Date & Time :</b></label>
                            <p id="updateDate"></p>
                        </div>
                        <div class="col-4" >
                            <label ><b>Designation No :</b></label>
                            <p id="InputDesigNo"></p>
                        </div>
                    </div>
                    <hr>

                    <!-- required mark -->
                    <div class="row mt-1">
                        <div class="col">
                            <p>Required <span class="text-danger">*</span></p>
                        </div>
                    </div>

                    <!-- Designation Name -->
                    <div class="row mt-2">
                        <div class="col-12">
                            <label for="textDesignationName" class="form-label fw-bold">Designation Name : <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <div class="input-group-text">
                                    <span>
                                        <i class="fa-solid fa-briefcase"></i>
                                    </span>
                                </div>
                                <input type="text" placeholder="Enter Designation Name" required id="textDesignationName" class="form-control">
                            </div>
                        </div>
                    </div>

                    <!-- buttons -->
                    <div class="row mt-4">
                        <div class="col-6">
                            <button type="reset" class="btn btn-outline-primary buttonClear" id="buttonClear">Clear</button>
                            <button type="button" class="btn btn-outline-info buttonPrint" id="buttonPrint">Print</button>
                            <button type="button" class="btn btn-outline-danger buttonDelete" id="buttonDelete">Delete</button>
                        </div>
                        <div class="col-6 text-end">
                            <button class="btn btn-outline-warning buttonUpdate" id="buttonUpdate" type="submit">Update</button>
                            <button class="btn btn-outline-success buttonSubmit" id="buttonSubmit" type="button">Submit</button>
                        </div>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
<!-- designation add form modal end -->


<!-- for print view modal start -->
<div class="modal" id="DesignationViewModal" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h2>View Designation</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="close"></button>
            </div>
            <div class="modal-body">
                <div class="card" id="divCardPrintDesignation">
                    <div class="card-header">
                        <h1>Designation Details</h1>
                    </div>
                    <div class="card-body">
                        <table class="table table-hover table-bordered table-striped">

                            <tr>
                                <th>Designation Name</th>
                                <td id="tdDesignationName"></td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
            <div class="modal-footer text-end">
                <button type="button" class="btn btn-info" onclick="printDesignationRecord()">Print</button>
            </div>
        </div>
    </div>
</div>
<!-- for print view modal end -->


<script src="/js/common/jquery-3.7.1.min.js"></script>
<script src="/css/bootstrap-5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="/js/layout/layout-topbar.js"></script>
<script src="/js/layout/layout-sidebar.js"></script>

<script src="/js/common/notification-bar.js"></script>
<script src="/js/notiflix/dist/notiflix-aio-3.2.8.min.js"></script>
<script src="/js/DataTabels/datatables.min.js"></script>
<script src="/js/common/commonFunction.js"></script>
<!-- linked js file -->
<script src="/js/employee/designations.js"></script>

</body>
</html>
