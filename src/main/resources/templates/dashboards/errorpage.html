<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Denied</title>
    <link rel="icon" href="/images/img/Logo.png">
    <link rel="stylesheet" href="/css/bootstrap-5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/fontawesome-free-7.0.1/css/all.min.css">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f4f6f8;
        }
        .error-card {
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        .error-icon {
            font-size: 5rem;
            color: #dc3545;
        }
        .error-code {
            font-size: 4rem;
            font-weight: 700;
            color: #212529;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card shadow error-card mx-auto p-4">
        <div class="card-body">
            <i class="fa-solid fa-triangle-exclamation error-icon mb-3"></i>
            <div class="error-code">403</div>
            <h3 class="mb-3">Access Denied</h3>
            <p class="text-muted mb-4">
                You don't have permission to access this page. If you believe this is a mistake, contact your system administrator.
            </p>
            <a href="/dashboard" class="btn btn-primary">
                <i class="fa-solid fa-house me-1"></i> Back to Dashboard
            </a>
            <a href="/logout" class="btn btn-outline-secondary ms-2">
                <i class="fa-solid fa-right-from-bracket me-1"></i> Logout
            </a>
        </div>
    </div>
</div>

</body>
</html>
